name: AI review

# Advisory review of the PR diff by tools/ai_review.py (DeepSeek via OpenRouter).
# The model reads the diff, file bodies and PR body as data; it never executes
# PR code, never approves, and never requests changes. Findings land in one
# sticky comment that is rewritten on every push.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: AI review (DeepSeek)
    # Drafts are not worth a model call; fork PRs get no secrets, so they are
    # skipped instead of failing on a missing OPENROUTER_API_KEY.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout head commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Same rule as quality-gates.yml: a missing base must be loud, because
      # validating against the wrong commit is worse than not validating.
      - name: Ensure base commit is present
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "Base commit $BASE_SHA is available locally."
            exit 0
          fi
          if ! git fetch --no-tags --quiet origin "$BASE_SHA"; then
            echo "::error::Could not fetch base commit $BASE_SHA; refusing to review a partial diff."
            exit 1
          fi

      # The PR body carries the machine-readable intent; the model reads it as
      # data. It goes through a file so no untrusted text is interpolated.
      - name: Write PR body to file
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "${PR_BODY:-}" > pr_body.md

      - name: Run review
        id: review
        continue-on-error: true
        # Shorter than the job's 15 minutes on purpose: a hung model call then
        # fails this step rather than the job, so the upsert below still runs and
        # replaces the comment with the fallback. A job timeout cancels the run,
        # and the upsert is skipped on cancellation so it cannot overwrite the
        # comment the newer run owns.
        timeout-minutes: 12
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p review-out
          # stderr is kept so the comment can say why no result was produced
          # (a payload over --max-chars names the size) instead of only "failed".
          # --max-chars is left at the tool's default so a local run without the
          # flag uses the same budget as this job. The default matches Robin's
          # max-diff-size in characters but bounds a different quantity (this
          # budget also counts the injected inventory and file bodies), so
          # neither ceiling contains the other; each arm refuses an oversized PR
          # rather than truncating it. There is no separate line cap: the body
          # budget alone decides what fits, and anything dropped is named in the
          # comment's review context.
          python3 tools/ai_review.py \
            --repo . \
            --range "${BASE_SHA}...${HEAD_SHA}" \
            --head "$HEAD_SHA" \
            --intent-file pr_body.md \
            --provider openrouter \
            --model deepseek/deepseek-v4.1-flash-1017 \
            --reasoning off \
            --out review-out \
            --md-out review-out/comment.md 2>review-out/reason.txt

      - name: Post or update the review comment
        id: post
        # Runs on a failed step, skipped when the run is cancelled. `always()`
        # is not that condition: it returns true on cancellation too, and the
        # cancelled runs of this workflow have executed this step. Cancellation
        # alone is not enough either: a run that finished after a newer push is
        # not cancelled, so the script compares the event's head with the PR
        # head before it writes.
        if: ${{ !cancelled() }}
        uses: actions/github-script@v7
        env:
          REVIEW_MD: review-out/comment.md
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          REVIEW_REASON: review-out/reason.txt
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- cellevox-ai-review -->';
            // Last stderr line: the tool names the reason it stopped (payload
            // over --max-chars, provider error) rather than leaving the author
            // to guess from a generic "failed".
            let reason = '';
            try {
              const lines = fs.readFileSync(process.env.REVIEW_REASON, 'utf8').trim().split('\n');
              reason = lines[lines.length - 1].slice(0, 300);
            } catch (err) {
              reason = '';
            }
            // stderr can be empty when the step fails before python prints
            // anything (an import error, a missing interpreter): say that
            // instead of implying the tool gave no reason.
            const fallback = '### AI diff review\n\n' +
              `The review did not produce a result (${process.env.REVIEW_OUTCOME}). ` +
              'See the job log.' +
              (reason ? `\n\n\`${reason}\``
                      : '\n\nNo reason was written by the review step.');
            // A non-success outcome can still leave a comment.md behind (a run
            // that failed after writing it). That file is not a result, so the
            // fallback wins unless the step actually succeeded.
            const report = process.env.REVIEW_OUTCOME === 'success' &&
              fs.existsSync(process.env.REVIEW_MD)
              ? fs.readFileSync(process.env.REVIEW_MD, 'utf8')
              : fallback;
            // GitHub rejects a comment over 65536 characters. Slicing the
            // composed body cut the tail of the findings and the advisory line
            // without saying so, so the report is shortened first, and the cut
            // is named in the comment.
            const advisory = '_Advisory: findings do not block the merge._';
            const notice = '\n\n_Report truncated at the comment size limit; ' +
              'the full text is in the ai-review artifact._';
            const room = 60000 - marker.length - advisory.length - notice.length - 4;
            const shown = report.length > room
              ? report.slice(0, room) + notice
              : report;
            const body = `${marker}\n${shown}\n\n${advisory}`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            // A run that was not cancelled can still be stale: it may have
            // finished after a newer push, or been re-run on an old commit.
            // Writing then would overwrite the comment the newer run owns.
            const head = context.payload.pull_request?.head?.sha;
            if (head) {
              const { data: pr } = await github.rest.pulls.get({
                owner, repo, pull_number: issue_number,
              });
              if (pr.head.sha !== head) {
                // The fail step reads this: a superseded run produced no result
                // for the current head, so it must not turn the PR red.
                core.setOutput('superseded', 'true');
                core.info(`superseded: ${head} is no longer the PR head (${pr.head.sha})`);
                return;
              }
            }
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            // Bot identity plus our marker, not the login: the default token
            // posts as github-actions[bot], but any other token would change the
            // login and silently start a second comment on every push. The
            // marker and this review's heading must open the body, so a bot
            // comment that quotes the marker, or opens with the marker alone, is
            // not mistaken for ours and rewritten.
            const opening = `${marker}\n### AI diff review`;
            const previous = comments.find(
              (c) => c.user?.type === 'Bot' && c.body?.startsWith(opening));

            if (previous) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: previous.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-review
          path: review-out/
          if-no-files-found: ignore

      # A model/API failure must be visible, but it is not a verdict on the PR.
      # A failed or skipped review produced no result, so the step keys on
      # != 'success' rather than == 'failure'. Cancellation is excluded, and so
      # is a run whose post step found the head had moved: both were superseded
      # by definition, so they must be neutral, not red.
      - name: Fail when the review could not run
        if: ${{ !cancelled() && steps.post.outputs.superseded != 'true' && steps.review.outcome != 'success' }}
        run: |
          echo "::error::AI review produced no result (outcome: ${{ steps.review.outcome }}); see the log above."
          exit 1
