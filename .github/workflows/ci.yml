name: CellEvoX Performance-Critical CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      benchmark_groups:
        description: "Benchmark groups to run: quick, timing, snapshot, all"
        required: false
        default: "quick"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bench-regression-check:
    runs-on: ubuntu-24.04
    # Hard ceiling for the whole job. The wall-clock gate below is advisory, so
    # the deterministic instruction gate is the only blocking performance signal.
    # The ceiling was measured with a warm ccache; ADR-0011 records that a
    # cold-cache timeout is an accepted, rerunnable infrastructure failure:
    # rerun the job, do not treat it as a verdict.
    timeout-minutes: 10

    steps:
    - name: Checkout Head (Current PR or New Main Commit)
      uses: actions/checkout@v4
      with:
        path: head

    # The verdict logic is the only blocking performance signal, so its unit
    # tests run before the expensive builds and fail fast. This step deliberately
    # runs before "Install Dependencies", so it uses the runner's system python3:
    # this file and the gate modules it imports must stay stdlib-only, or move
    # the step after the install.
    - name: Test Instruction Gate Verdict Logic
      run: python3 head/CellEvoX/tests/benchmarks/test_perf_ir_gate.py

    # The Ubuntu mirror occasionally throttles to a few kB/s, which used to
    # stretch this step from ~30 s to 15-38 min. Cache the .deb archives so a
    # slow mirror can only affect a cold cache.
    - name: Restore APT package cache
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/.apt-cache
        key: apt-${{ runner.os }}-${{ hashFiles('head/.github/workflows/ci.yml') }}
        restore-keys: |
          apt-${{ runner.os }}-

    - name: Install Dependencies
      env:
        APT_ARCHIVES: ${{ github.workspace }}/.apt-cache
      run: |
        set -euo pipefail
        PACKAGES="build-essential cmake libspdlog-dev libtbb-dev libeigen3-dev nlohmann-json3-dev python3-dev python3-numpy python3-matplotlib ccache valgrind"
        sudo apt-get update
        mkdir -p "$APT_ARCHIVES/partial"
        sudo apt-get install -y --download-only -o Dir::Cache::archives="$APT_ARCHIVES" $PACKAGES
        sudo apt-get install -y -o Dir::Cache::archives="$APT_ARCHIVES" $PACKAGES
        # apt creates the lock file and partial/ as root; the cache post-step
        # runs unprivileged and cannot archive them otherwise.
        sudo chown -R "$(id -u):$(id -g)" "$APT_ARCHIVES"

    - name: Setup Ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ runner.os }}-ccache-${{ github.ref_name }}
        restore-keys: |
          ${{ runner.os }}-ccache-main

    - name: Determine Base Commit
      id: base_info
      run: |
        set -euo pipefail
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
        elif [ "${{ github.event_name }}" = "push" ]; then
          BASE_SHA="${{ github.event.before }}"
        else
          BASE_SHA=""
        fi

        cd head
        if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
          echo "Base SHA missing; falling back to origin/main"
          git fetch origin main --depth=1
          BASE_SHA=$(git rev-parse FETCH_HEAD)
        fi

        echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
        echo "Comparing against SHA: $BASE_SHA"

    - name: Checkout Base Commit
      run: |
        set -euo pipefail
        mkdir base_repo
        git -C base_repo init
        git -C base_repo remote add origin https://github.com/${{ github.repository }}.git
        git -C base_repo fetch --depth=1 origin "${{ steps.base_info.outputs.base_sha }}"
        git -C base_repo checkout --detach FETCH_HEAD

    - name: Build Base (Exact Comparison Commit)
      id: build_base
      run: |
        # The instruction gate compares the same probe in both trees. The probe is
        # new in this PR, so inject it into the base checkout instead of requiring
        # the base commit to already contain it (ADR-0011). A red Build Base with
        # a green Build Head is usually a changed probe interface, not a verdict;
        # see the diagnosis paragraph in docs/runbook.md.
        # Overwrite any probe files the base checkout already carries: both
        # sides must measure the same probe source, so the head probe wins. The
        # copy covers the target definition (perf_probe.cmake) as well as the
        # probe, so both sides build the same target from the same sources and
        # options. When the base tree already includes that file the guard below
        # keeps its include line, and the copied file is what it includes; a base
        # tree that declared the target inline instead fails Build Base with a
        # duplicate target rather than silently measuring a different probe.
        cp head/CellEvoX/tests/perf_probe.cpp head/CellEvoX/tests/perf_probe.cmake base_repo/CellEvoX/tests/
        echo "Base probe source: head/CellEvoX/tests/perf_probe.cpp (injected; both sides measure the same instrument)"
        # Append after the existing content instead of anchoring on a target
        # line: the probe needs CORE_SOURCES defined, and nothing in the include
        # depends on where the other targets are declared. Guard the append so
        # the step stays idempotent once the probe itself lands on main.
        if ! grep -q 'tests/perf_probe.cmake' base_repo/CellEvoX/CMakeLists.txt; then
          echo 'include(${CMAKE_CURRENT_SOURCE_DIR}/tests/perf_probe.cmake)' >> base_repo/CellEvoX/CMakeLists.txt
        fi
        cmake -B base_build -S base_repo/CellEvoX -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DSKIP_GUI=ON -DCELLEVOX_BUILD_PERF_PROBE=ON
        cmake --build base_build --target CellEvoXTests CellEvoXPerfProbe -j$(nproc)

    - name: Build Head (Current PR)
      id: build_head
      run: |
        echo "Head probe source: head/CellEvoX/tests/perf_probe.cpp (this PR's tree)"
        cmake -B head_build -S head/CellEvoX -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCELLEVOX_WARNINGS_AS_ERRORS=ON -DCELLEVOX_BUILD_PERF_PROBE=ON
        cmake --build head_build --target CellEvoX CellEvoXTests CellEvoXPerfProbe -j$(nproc)

    - name: Run Unit Tests (CTest)
      working-directory: head_build
      run: ctest --output-on-failure --output-junit "$RUNNER_TEMP/ctest.xml"

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ctest-results
        path: ${{ runner.temp }}/ctest.xml
        if-no-files-found: ignore

    # Blocking performance signal (ADR-0011). Retired instruction counts are
    # reproducible run-to-run, unlike wall-clock timings on shared runners, so a
    # regression here is a real change in work performed. To admit a cost this
    # PR deliberately accepts, add --accepted-delta WORKLOAD=RATIO here (one
    # workload, visible in review); do not raise --threshold.
    - name: Deterministic Instruction Gate
      # Skip when a build failed: the probe binaries do not exist and the step
      # would only add a second, confusing error.
      if: steps.build_base.outcome == 'success' && steps.build_head.outcome == 'success'
      run: |
        mkdir -p benchmark_reports
        python3 head/CellEvoX/tests/benchmarks/perf_ir_gate.py \
          --base-binary base_build/bin/CellEvoXPerfProbe \
          --head-binary head_build/bin/CellEvoXPerfProbe \
          --report-json benchmark_reports/perf-ir-gate.json

    - name: Paired Performance Gate (advisory timing)
      # Run even when the instruction gate failed: the advisory report is the
      # evidence for a failure investigation, and it is uploaded below. Skip it
      # when a build failed, where the binaries do not exist and the step would
      # only add a second, confusing error.
      if: always() && steps.build_base.outcome == 'success' && steps.build_head.outcome == 'success'
      env:
        BENCHMARK_GROUPS: ${{ inputs.benchmark_groups || 'quick' }}
      run: |
        mkdir -p benchmark_reports
        python3 head/CellEvoX/tests/benchmarks/ci_benchmark_gate.py \
          --base-binary base_build/bin/CellEvoXTests \
          --head-binary head_build/bin/CellEvoXTests \
          --groups "$BENCHMARK_GROUPS" \
          --rounds 3 \
          --initial-samples 3 \
          --threshold 0.05 \
          --memory-threshold 0.10 \
          --max-relative-ci 0.05 \
          --advisory-timing \
          --benchmark-warmup-time 200 \
          --benchmark-resamples 20000 \
          --benchmark-confidence-interval 0.95 \
          --out-dir benchmark_reports \
          --report-json benchmark_reports/perf-gate.json

    - name: Upload Benchmark Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-reports
        path: benchmark_reports

  coverage:
    name: C++ line coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # Same mirror-throttling exposure as the benchmark job: a cold install took
    # 22 of this job's 24 minutes. Reuse the .deb cache instead.
    - name: Restore APT package cache
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/.apt-cache
        key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
        restore-keys: |
          apt-${{ runner.os }}-

    - name: Install Dependencies
      env:
        APT_ARCHIVES: ${{ github.workspace }}/.apt-cache
      run: |
        set -euo pipefail
        PACKAGES="build-essential cmake libspdlog-dev libtbb-dev libeigen3-dev \
          nlohmann-json3-dev python3-dev python3-numpy python3-matplotlib"
        sudo apt-get update
        mkdir -p "$APT_ARCHIVES/partial"
        sudo apt-get install -y --download-only -o Dir::Cache::archives="$APT_ARCHIVES" $PACKAGES
        sudo apt-get install -y -o Dir::Cache::archives="$APT_ARCHIVES" $PACKAGES
        sudo chown -R "$(id -u):$(id -g)" "$APT_ARCHIVES"

    - name: Configure Coverage Build
      run: >
        cmake -B coverage_build -S CellEvoX
        -DCMAKE_BUILD_TYPE=Debug
        -DCELLEVOX_ENABLE_COVERAGE=ON
        -DCELLEVOX_NATIVE_OPTIMIZATIONS=OFF

    - name: Build Tests
      run: cmake --build coverage_build --target CellEvoXTests -j$(nproc)

    - name: Run Tests
      working-directory: coverage_build
      run: ctest --output-on-failure

    # Baseline recorded on 2026-10-26: 2000/2886 lines (69.3%) over
    # CellEvoX/src + CellEvoX/include. Ratchet this once the number is stable.
    - name: Generate Coverage Report
      run: |
        set -o pipefail
        mkdir -p coverage
        python3 CellEvoX/tests/coverage_report.py \
          --root . \
          --build-dir coverage_build \
          --json-out coverage/coverage.json | tee coverage/coverage.txt
        cat coverage/coverage.txt >> "$GITHUB_STEP_SUMMARY"

    - name: Upload Coverage Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/
        if-no-files-found: warn

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web/frontend
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: web/frontend/package-lock.json

    - name: Install Dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Build
      run: npm run build

  snapshot-abi-python:
    name: Snapshot ABI Python contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Dependencies
      run: python3 -m pip install --quiet pandas

    - name: Run Snapshot IO Contract Tests
      run: python3 CellEvoX/scripts/test_snapshot_io.py -v

  backend-tests:
    name: Backend pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web/backend
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: |
          web/backend/requirements.txt
          web/backend/requirements-dev.txt

    - name: Install Dependencies
      run: python3 -m pip install --quiet -r requirements.txt -r requirements-dev.txt

    - name: Run Tests
      run: python3 -m pytest -q tests

  review-tools:
    name: Review tooling tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install pytest
      run: python3 -m pip install --quiet pytest

    # The review tool is stdlib-only; the tests stub the model response, so
    # this job never needs OPENROUTER_API_KEY and never touches the network.
    - name: Run Tests
      run: python3 -m pytest -q tools/test_ai_review.py
