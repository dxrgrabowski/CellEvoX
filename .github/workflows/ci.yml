name: CellEvoX Performance-Critical CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      benchmark_groups:
        description: "Benchmark groups to run: quick, timing, snapshot, all"
        required: false
        default: "quick"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bench-regression-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
    - name: Checkout Head (Current PR or New Main Commit)
      uses: actions/checkout@v4
      with:
        path: head

    # The Ubuntu mirror occasionally throttles to a few kB/s, which used to
    # stretch this step from ~30 s to 15-38 min. Cache the .deb archives so a
    # slow mirror can only affect a cold cache.
    - name: Restore APT package cache
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/.apt-cache
        key: apt-${{ runner.os }}-${{ hashFiles('head/.github/workflows/ci.yml') }}
        restore-keys: |
          apt-${{ runner.os }}-

    - name: Install Dependencies
      env:
        APT_ARCHIVES: ${{ github.workspace }}/.apt-cache
      run: |
        set -euo pipefail
        PACKAGES="build-essential cmake libspdlog-dev libtbb-dev libeigen3-dev nlohmann-json3-dev python3-dev python3-numpy python3-matplotlib ccache"
        sudo apt-get update
        mkdir -p "$APT_ARCHIVES/partial"
        sudo apt-get install -y --download-only -o Dir::Cache::archives="$APT_ARCHIVES" $PACKAGES
        sudo apt-get install -y -o Dir::Cache::archives="$APT_ARCHIVES" $PACKAGES
        # apt creates the lock file and partial/ as root; the cache post-step
        # runs unprivileged and cannot archive them otherwise.
        sudo chown -R "$(id -u):$(id -g)" "$APT_ARCHIVES"

    - name: Setup Ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ runner.os }}-ccache-${{ github.ref_name }}
        restore-keys: |
          ${{ runner.os }}-ccache-main

    - name: Determine Base Commit
      id: base_info
      run: |
        set -euo pipefail
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
        elif [ "${{ github.event_name }}" = "push" ]; then
          BASE_SHA="${{ github.event.before }}"
        else
          BASE_SHA=""
        fi

        cd head
        if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
          echo "Base SHA missing; falling back to origin/main"
          git fetch origin main --depth=1
          BASE_SHA=$(git rev-parse FETCH_HEAD)
        fi

        echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
        echo "Comparing against SHA: $BASE_SHA"

    - name: Checkout Base Commit
      run: |
        set -euo pipefail
        mkdir base_repo
        git -C base_repo init
        git -C base_repo remote add origin https://github.com/${{ github.repository }}.git
        git -C base_repo fetch --depth=1 origin "${{ steps.base_info.outputs.base_sha }}"
        git -C base_repo checkout --detach FETCH_HEAD

    - name: Build Base (Exact Comparison Commit)
      run: |
        cmake -B base_build -S base_repo/CellEvoX -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DSKIP_GUI=ON
        cmake --build base_build --target CellEvoXTests -j$(nproc)

    - name: Build Head (Current PR)
      run: |
        cmake -B head_build -S head/CellEvoX -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCELLEVOX_WARNINGS_AS_ERRORS=ON
        cmake --build head_build --target CellEvoX CellEvoXTests -j$(nproc)

    - name: Run Unit Tests (CTest)
      working-directory: head_build
      run: ctest --output-on-failure --output-junit "$RUNNER_TEMP/ctest.xml"

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ctest-results
        path: ${{ runner.temp }}/ctest.xml
        if-no-files-found: ignore

    - name: Paired Performance Gate
      env:
        BENCHMARK_GROUPS: ${{ inputs.benchmark_groups || 'quick' }}
      run: |
        mkdir -p benchmark_reports
        python3 head/CellEvoX/tests/benchmarks/ci_benchmark_gate.py \
          --base-binary base_build/bin/CellEvoXTests \
          --head-binary head_build/bin/CellEvoXTests \
          --groups "$BENCHMARK_GROUPS" \
          --rounds 7 \
          --initial-samples 5 \
          --retry-samples 10 \
          --threshold 0.05 \
          --memory-threshold 0.10 \
          --max-relative-ci 0.05 \
          --fail-on-inconclusive \
          --benchmark-warmup-time 200 \
          --benchmark-resamples 20000 \
          --benchmark-confidence-interval 0.95 \
          --out-dir benchmark_reports \
          --report-json benchmark_reports/perf-gate.json

    - name: Upload Benchmark Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-reports
        path: benchmark_reports

  coverage:
    name: C++ line coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # Same mirror-throttling exposure as the benchmark job: a cold install took
    # 22 of this job's 24 minutes. Reuse the .deb cache instead.
    - name: Restore APT package cache
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/.apt-cache
        key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
        restore-keys: |
          apt-${{ runner.os }}-

    - name: Install Dependencies
      env:
        APT_ARCHIVES: ${{ github.workspace }}/.apt-cache
      run: |
        set -euo pipefail
        PACKAGES="build-essential cmake libspdlog-dev libtbb-dev libeigen3-dev \
          nlohmann-json3-dev python3-dev python3-numpy python3-matplotlib"
        sudo apt-get update
        mkdir -p "$APT_ARCHIVES/partial"
        sudo apt-get install -y --download-only -o Dir::Cache::archives="$APT_ARCHIVES" $PACKAGES
        sudo apt-get install -y -o Dir::Cache::archives="$APT_ARCHIVES" $PACKAGES
        sudo chown -R "$(id -u):$(id -g)" "$APT_ARCHIVES"

    - name: Configure Coverage Build
      run: >
        cmake -B coverage_build -S CellEvoX
        -DCMAKE_BUILD_TYPE=Debug
        -DCELLEVOX_ENABLE_COVERAGE=ON
        -DCELLEVOX_NATIVE_OPTIMIZATIONS=OFF

    - name: Build Tests
      run: cmake --build coverage_build --target CellEvoXTests -j$(nproc)

    - name: Run Tests
      working-directory: coverage_build
      run: ctest --output-on-failure

    # Baseline recorded on 2026-10-26: 2000/2886 lines (69.3%) over
    # CellEvoX/src + CellEvoX/include. Ratchet this once the number is stable.
    - name: Generate Coverage Report
      run: |
        set -o pipefail
        mkdir -p coverage
        python3 CellEvoX/tests/coverage_report.py \
          --root . \
          --build-dir coverage_build \
          --json-out coverage/coverage.json | tee coverage/coverage.txt
        cat coverage/coverage.txt >> "$GITHUB_STEP_SUMMARY"

    - name: Upload Coverage Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/
        if-no-files-found: warn

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web/frontend
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: web/frontend/package-lock.json

    - name: Install Dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Build
      run: npm run build

  backend-tests:
    name: Backend pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web/backend
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: |
          web/backend/requirements.txt
          web/backend/requirements-dev.txt

    - name: Install Dependencies
      run: python3 -m pip install --quiet -r requirements.txt -r requirements-dev.txt

    - name: Run Tests
      run: python3 -m pytest -q tests
