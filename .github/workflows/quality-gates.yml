name: PR Quality Gates

# Deterministic gates only: no model, no secrets, no network beyond package installs.
# The PR body is treated as untrusted input and is never interpolated into a shell.
# Pull-request only: the body structure is checked against the PR body, which does
# not exist for `workflow_dispatch`, so a dispatched run could only fail.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  body:
    name: PR body structure
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout head commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test the body check
        run: python3 .github/scripts/test_validate_pr_body.py

      - name: Write PR body to file
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "${PR_BODY:-}" > pr_body.md

      # Structure only: the check cannot confirm that a criterion is right, that
      # the user approved a decision, or that the change works.
      - name: Check the PR body structure
        run: python3 .github/scripts/validate_pr_body.py --body-file pr_body.md
